# Static files for atipik.middlewa.re. Traefik sends /api/* straight to the API
# container, so nginx only serves the tornado (/) and the back-office (/admin/).
server {
  listen 80;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  # HTTPS only from now on (Traefik already redirects plain HTTP).
  add_header Strict-Transport-Security "max-age=31536000" always;
  # Both pages load only their own scripts and styles, plus Google Fonts;
  # nothing inline, so no 'unsafe-inline' is needed.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # Tornado page, mounted read-only from the deployment folder.
  root /usr/share/nginx/front;
  index index.html;

  location / {
    try_files $uri $uri/ =404;
  }

  # Pages are always revalidated, so a deployment is picked up right away
  # (scripts and styles are versioned with ?v= in the page).
  location = /index.html {
    expires epoch;
  }

  location = /admin {
    return 301 /admin/;
  }

  location /admin/ {
    alias /usr/share/nginx/admin/;
    try_files $uri $uri/ /admin/index.html;
    expires epoch;
  }

  # Vite fingerprints asset names, so they can be cached for good.
  location /admin/assets/ {
    alias /usr/share/nginx/admin/assets/;
    expires 1y;
  }
}
