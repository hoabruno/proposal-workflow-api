name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, unit and e2e tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      # npm 9 and 10 crash on this dependency tree.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test
      # Starts a throwaway PostgreSQL 18 through embedded-postgres.
      - run: npm run test:e2e
      - run: npm run build

  admin:
    name: Back-office (type check and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [api, admin]
    steps:
      - uses: actions/checkout@v5
      - run: docker build --tag atipik-api ./api
      - run: docker build --tag atipik-web ./admin
